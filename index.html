<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cricket Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#04190e; --surface:#0e261a; --surface-raised:#1c372a; --surface-pressed:#0e1a14;
    --line:#24382d; --text:#eaf2ec; --text-muted:#86a190; --text-dim:#526258;
    --score-amber:#f2ac19; --accent-green:#a4e238; --wicket-red:#e62b34; --extra-amber:#f2ac19; --noball-blue:#4cb0e5; --deadball:#64766c;
    --font-display:'Rajdhani','Space Grotesk',sans-serif; --font-body:'Space Grotesk',system-ui,sans-serif;
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px; --radius-xl:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#04190e;color:var(--text);font-family:var(--font-body);}
  body{min-height:100vh;display:flex;justify-content:center;padding:24px 12px;}
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent-green);outline-offset:2px;}
  h1,h2,p{margin:0;}
  .app-shell{width:100%;max-width:400px;display:flex;flex-direction:column;background:var(--bg);
    border-radius:var(--radius-lg);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);overflow:hidden;position:relative;}

  .setup-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px 40px;}
  .setup-header{text-align:center;margin-bottom:32px;}
  .setup-emoji{font-size:40px;display:block;margin-bottom:8px;}
  .setup-title{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:.02em;}
  .setup-subtitle{margin-top:6px;color:var(--text-muted);font-size:15px;}
  .setup-form{display:flex;flex-direction:column;gap:16px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:8px;}
  .field-label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);}
  .field input{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-md);
    padding:14px 16px;font-size:17px;font-weight:600;color:var(--text);width:100%;}
  .field input:focus{border-color:var(--accent-green);}
  .start-button{margin-top:10px;background:var(--accent-green);color:#06241a;font-family:var(--font-display);
    font-weight:700;font-size:19px;letter-spacing:.03em;padding:16px;border-radius:var(--radius-md);min-height:54px;}
  .start-button:active{transform:scale(.98);}

  .app-header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);}
  .app-header-title{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.03em;color:var(--text-muted);}
  .app-menu-button{min-width:36px;min-height:36px;border-radius:var(--radius-sm);font-size:18px;color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;}
  .app-menu-button:active{background:var(--surface-raised);}
  .app-menu{position:absolute;top:48px;right:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:6px;box-shadow:0 12px 28px rgba(0,0,0,.4);z-index:10;}
  .app-menu-item{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:var(--radius-sm);
    font-weight:600;font-size:13px;white-space:nowrap;color:var(--wicket-red);}
  .app-menu-item:active{background:var(--surface-raised);}

  .scoreboard{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 20px 20px;text-align:left;}
  .scoreboard-header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .scoreboard-team{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-green);}
  .scoreboard-innings-badge{flex-shrink:0;background:var(--surface-raised);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--text);}
  .scoreboard-score{font-family:var(--font-display);font-weight:700;font-size:58px;line-height:1;color:var(--text);
    letter-spacing:.01em;font-variant-numeric:tabular-nums;}
  .scoreboard-slash{color:var(--text-dim);margin:0 3px;font-weight:500;}
  .scoreboard-overs{margin-top:4px;font-size:16px;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .scoreboard-divider{margin:16px 0 14px;border-top:1px solid var(--line);}
  .scoreboard-stats-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .scoreboard-stat{display:flex;flex-direction:column;gap:5px;}
  .scoreboard-stat-right{align-items:flex-end;text-align:right;}
  .scoreboard-stat-label{font-size:12px;font-weight:600;color:var(--text-muted);}
  .scoreboard-stat-value{font-family:var(--font-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;}
  .scoreboard-stat-value.target-value{color:var(--accent-green);}
  .scoreboard-stat-value.required-value{color:var(--score-amber);}
  .scoreboard-stat-sub{margin-left:6px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--text-muted);}
  .scoreboard-note{margin-top:12px;font-size:11px;font-weight:500;color:var(--text-dim);}

  .run-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 14px 0;}
  .run-button{aspect-ratio:1.5/1;border-radius:var(--radius-xl);background:var(--accent-green);border:none;
    font-family:var(--font-display);font-weight:700;font-size:30px;color:#0c1a08;display:flex;align-items:center;justify-content:center;}
  .run-button:active{transform:scale(.95);filter:brightness(.92);}
  .run-button:disabled{opacity:.35;}

  .event-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 14px 0;}
  .event-button{min-height:48px;border-radius:var(--radius-xl);border:none;font-weight:700;font-size:14px;letter-spacing:.04em;}
  .event-button:active{transform:scale(.96);filter:brightness(.92);}
  .event-button:disabled{opacity:.35;}
  .event-wicket{background:var(--wicket-red);color:#fff;}
  .event-wide{background:var(--extra-amber);color:#12100a;}
  .event-noball{background:var(--noball-blue);color:#0a1620;}
  .event-deadball{background:var(--surface-raised);color:var(--text-muted);}

  .secondary-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 14px 0;}
  .undo-button,.custom-button{min-height:44px;border-radius:var(--radius-md);border:1.5px solid var(--line);
    background:transparent;color:var(--text);font-weight:600;font-size:13px;}
  .undo-button:active,.custom-button:active{transform:scale(.97);}
  .undo-button:disabled{opacity:.3;color:var(--text-muted);}
  .custom-button{color:var(--accent-green);border-color:rgba(164,226,56,.35);}

  .history{margin-top:16px;padding:0 14px 20px;}
  .history-title-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
  .history-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);}
  .history-hint{font-size:11px;color:var(--text-dim);}
  .history-empty{color:var(--text-dim);font-size:13px;}
  .history-overs{display:flex;flex-direction:column-reverse;gap:10px;max-height:200px;overflow-y:auto;}
  .history-over{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .history-over-label{font-size:11px;font-weight:700;color:var(--text-dim);min-width:48px;}
  .history-chips{display:flex;gap:5px;flex-wrap:wrap;}
  .chip{min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--surface-raised);border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-muted);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .chip:active{transform:scale(.92);}
  .chip-boundary{color:var(--accent-green);border-color:rgba(164,226,56,.35);}
  .chip-wicket{color:var(--wicket-red);border-color:rgba(230,43,52,.4);background:rgba(230,43,52,.1);}
  .chip-extra{color:var(--extra-amber);border-color:rgba(242,172,25,.35);}
  .chip-dead{color:var(--text-dim);}

  .innings-summary,.result-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px 40px;}
  .innings-summary-eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-green);margin-bottom:12px;}
  .innings-summary-team{font-family:var(--font-display);font-weight:700;font-size:22px;}
  .innings-summary-score{font-family:var(--font-display);font-weight:700;font-size:56px;color:var(--score-amber);margin-top:4px;font-variant-numeric:tabular-nums;}
  .innings-summary-overs{margin-top:4px;color:var(--text-muted);font-weight:600;}
  .innings-summary-button,.result-new-match{margin-top:32px;width:100%;max-width:280px;min-height:52px;background:var(--accent-green);
    color:#06241a;font-family:var(--font-display);font-weight:700;font-size:17px;border-radius:var(--radius-md);}
  .innings-summary-button:active,.result-new-match:active{transform:scale(.98);}

  .result-headline{font-family:var(--font-display);font-weight:700;font-size:25px;color:var(--score-amber);}
  .result-subline{margin-top:8px;color:var(--text-muted);font-weight:600;}
  .result-card{margin-top:24px;width:100%;max-width:300px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
  .result-row{display:flex;align-items:baseline;justify-content:space-between;}
  .result-team{font-weight:600;color:var(--text-muted);font-size:14px;}
  .result-score{font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;}
  .result-overs{font-size:12px;font-weight:500;color:var(--text-dim);}

  .confirm-overlay,.composer-overlay{position:fixed;inset:0;background:rgba(6,12,9,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .confirm-card{width:100%;max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;text-align:center;}
  .confirm-text{font-weight:600;font-size:15px;line-height:1.4;}
  .confirm-actions{margin-top:20px;display:flex;gap:10px;}
  .confirm-actions button{flex:1;min-height:46px;border-radius:var(--radius-md);font-weight:700;font-size:14px;}
  .confirm-cancel{background:var(--surface-raised);color:var(--text);}
  .confirm-confirm{background:var(--wicket-red);color:#2a0a06;}

  .composer-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:20px;max-height:88vh;overflow-y:auto;}
  .composer-title{font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:2px;}
  .composer-sub{font-size:12px;color:var(--text-dim);margin-bottom:16px;}
  .composer-section-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
  .segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px;}
  .segmented button{padding:10px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--surface-raised);
    font-size:12px;font-weight:700;color:var(--text-muted);}
  .segmented button.active{border-color:var(--accent-green);color:var(--accent-green);background:rgba(164,226,56,.12);}
  .segmented button:disabled{opacity:.35;}

  .stepper-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px;}
  .stepper-btn{width:44px;height:44px;border-radius:50%;background:var(--surface-raised);border:1.5px solid var(--line);
    font-size:20px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;}
  .stepper-btn:active{transform:scale(.92);}
  .stepper-btn:disabled{opacity:.3;}
  .stepper-value{font-family:var(--font-display);font-weight:700;font-size:36px;min-width:56px;text-align:center;color:var(--score-amber);}
  .quick-runs{display:flex;gap:6px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .quick-runs button{width:36px;height:36px;border-radius:50%;background:var(--surface-raised);border:1px solid var(--line);
    font-size:13px;font-weight:700;color:var(--text-muted);}
  .quick-runs button.active{background:rgba(242,172,25,.15);border-color:var(--score-amber);color:var(--score-amber);}
  .quick-runs button:disabled{opacity:.3;}

  .wicket-toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-raised);
    border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:18px;}
  .wicket-toggle-row.on{border-color:rgba(230,43,52,.5);background:rgba(230,43,52,.1);}
  .wicket-toggle-label{font-weight:600;font-size:14px;}
  .toggle-switch{width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;}
  .toggle-switch.on{background:var(--wicket-red);}
  .toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);
    transition:transform .12s ease;}
  .toggle-switch.on::after{transform:translateX(20px);background:#fff;}

  .composer-preview{background:var(--surface-pressed);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:12px 14px;margin-bottom:18px;font-size:13px;line-height:1.7;color:var(--text-muted);}
  .composer-preview b{color:var(--text);font-family:var(--font-display);font-weight:700;font-size:15px;}
  .composer-note{font-size:11px;color:var(--extra-amber);margin:-10px 0 16px;}

  .composer-actions{display:flex;gap:8px;}
  .composer-actions button{flex:1;min-height:48px;border-radius:var(--radius-md);font-weight:700;font-size:14px;}
  .composer-cancel{background:var(--surface-raised);color:var(--text);}
  .composer-save{background:var(--accent-green);color:#06241a;}
  .composer-delete{background:transparent;color:var(--wicket-red);border:1.5px solid rgba(230,43,52,.4);
    width:100%;min-height:42px;border-radius:var(--radius-md);font-weight:700;font-size:13px;margin-top:10px;}

  .preview-note{max-width:400px;margin:0 auto 14px;text-align:center;font-size:12px;color:#6b8177;padding:0 8px;}

  /* Shared by the tournament match log (renderTournamentMatchRow) — a
     match-summary card, no longer used for a standalone history browser. */
  .history-entry{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:12px 14px;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .history-entry:active{transform:scale(.98);}
  .history-entry-date{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
  .history-entry-row{display:flex;align-items:baseline;justify-content:space-between;padding:2px 0;gap:10px;}
  .history-entry-team{font-weight:600;font-size:14px;color:var(--text-muted);}
  .history-entry-team.winner{color:var(--accent-green);}
  .history-entry-score{font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .history-entry-overs{font-family:var(--font-body);font-size:11px;font-weight:500;color:var(--text-dim);}
  .history-entry-result{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--score-amber);}

  /* ---- Tabs ---- */
  .app-tabs-shell{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:stretch;}
  .app-tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:5px;margin-bottom:14px;}
  .tab-button{flex:1;min-height:44px;border-radius:var(--radius-md);background:transparent;color:var(--text-muted);
    font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em;}
  .tab-button.active{background:var(--accent-green);color:#06241a;}
  .tab-button:active{transform:scale(.97);}
  .tab-content{display:none;flex-direction:column;align-items:center;}
  .tab-content.active{display:flex;}

  /* ---- Tournament hub ---- */
  .tournament-hub{padding:18px 16px 20px;display:flex;flex-direction:column;}
  .tournament-hub-title{font-family:var(--font-display);font-weight:700;font-size:19px;}
  .tournament-hub-subtitle{margin-top:6px;font-size:12px;color:var(--text-dim);line-height:1.5;}
  .tournament-hub-hint{margin-top:10px;font-size:11px;color:var(--text-dim);text-align:center;}
  .tournament-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .tournament-card{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:14px 16px;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .tournament-card:active{transform:scale(.98);}
  .tournament-name{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .tournament-meta{margin-top:4px;font-size:12px;color:var(--text-muted);}
  .btn-new-tournament{margin-top:18px;min-height:50px;background:var(--accent-green);color:#06241a;
    font-family:var(--font-display);font-weight:700;font-size:15px;border-radius:var(--radius-md);}
  .btn-new-tournament:active{transform:scale(.98);}
  .empty-state{text-align:center;padding:30px 6px 6px;color:var(--text-muted);}
  .empty-state p{margin-bottom:10px;}
  .empty-state-sub{font-size:13px;color:var(--text-dim);line-height:1.5;}

  /* ---- Tournament dashboard ---- */
  .tournament-dashboard{padding:18px 16px 24px;display:flex;flex-direction:column;}
  .tournament-dash-header{display:flex;align-items:center;gap:10px;}
  .btn-back{min-height:36px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:transparent;color:var(--text-muted);font-weight:600;font-size:13px;flex-shrink:0;}
  .btn-back:active{background:var(--surface-raised);}
  .tournament-dash-title{font-family:var(--font-display);font-weight:700;font-size:18px;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tournament-dash-meta{margin-top:10px;font-size:12px;color:var(--text-dim);}
  .tournament-section-title{margin-top:22px;margin-bottom:10px;font-size:12px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--text-dim);}
  .btn-delete-tournament{margin-top:26px;min-height:42px;border-radius:var(--radius-md);border:1.5px solid rgba(230,43,52,.4);
    background:transparent;color:var(--wicket-red);font-weight:700;font-size:13px;}
  .btn-delete-tournament:active{background:rgba(230,43,52,.08);}

  .standings-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .standings-table{width:100%;border-collapse:collapse;font-size:12px;}
  .standings-table th{padding:8px 6px;text-align:center;color:var(--text-dim);font-weight:700;font-size:10px;
    letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap;}
  .standings-table th:nth-child(2){text-align:left;}
  .standings-table td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  .standings-rank{color:var(--text-dim);font-weight:700;}
  .standings-team{text-align:left;font-weight:600;color:var(--text);white-space:nowrap;}
  .standings-number{color:var(--text-muted);}
  .standings-points{color:var(--accent-green);font-weight:700;font-family:var(--font-display);}
  .tournament-match-list{display:flex;flex-direction:column;gap:10px;}

  /* ---- Form fields shared by tournament dialogs ---- */
  .field textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-md);
    padding:14px 16px;font-size:15px;font-weight:600;color:var(--text);width:100%;font-family:inherit;resize:vertical;}
  .field textarea:focus{border-color:var(--accent-green);}
  .field-select{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-md);
    padding:12px 14px;font-size:15px;font-weight:600;color:var(--text);width:100%;margin-bottom:14px;font-family:inherit;}
  .field-select:focus{border-color:var(--accent-green);}
</style>
</head>
<body>
<div class="app-tabs-shell">
  <div class="app-tabs">
    <button type="button" class="tab-button active" id="tabBtnMatch">🏏 Match</button>
    <button type="button" class="tab-button" id="tabBtnTournament">🏆 Tournament</button>
  </div>
  <div id="match-tab-content" class="tab-content active">
    <div class="preview-note">Live Cricket score and Tap and hold (or double-click) any chip in Ball History to edit it. Your in-progress match is saved on this device and survives a refresh — it's cleared automatically once the match ends. When a match finishes, you can link it to a 🏆 Tournament for standings.</div>
    <div id="root" class="app-shell"></div>
  </div>
  <div id="tournament-tab-content" class="tab-content">
    <div id="tournament-root" class="app-shell"></div>
  </div>
</div>

<script>
// ---- Models ----
const MIN_PLAYERS = 2, MAX_PLAYERS = 30, MIN_OVERS = 1, MAX_OVERS = 200;
const DEFAULT_PLAYERS = 11, DEFAULT_OVERS = 10;

function maxWickets(players){ return Math.max(0, players - 1); }
function maxLegalBalls(overs){ return overs * 6; }
function oversDisplay(legalBalls){
  const overs = Math.floor(legalBalls / 6);
  const balls = legalBalls % 6;
  return overs + '.' + balls;
}
function clamp(v, min, max){ if(Number.isNaN(v)) return min; return Math.min(max, Math.max(min, v)); }
function validateSetup(input){
  const rawPlayers = Number.isFinite(input.players) ? Math.round(input.players) : DEFAULT_PLAYERS;
  const rawOvers = Number.isFinite(input.overs) ? Math.round(input.overs) : DEFAULT_OVERS;
  return {
    players: clamp(rawPlayers, MIN_PLAYERS, MAX_PLAYERS),
    overs: clamp(rawOvers, MIN_OVERS, MAX_OVERS),
    teamA: (input.teamA || '').trim() || 'Team A',
    teamB: (input.teamB || '').trim() || 'Team B',
  };
}
function createInnings(){ return { runs:0, wickets:0, legalBalls:0, events:[] }; }
function createMatch(setup){
  return { setup, innings1: createInnings(), innings2: createInnings(), status: 'innings1', winner: undefined, resultText: undefined, historyLogged: false };
}

// Snapshot of a finished match, permanently logged to matchHistory — plain
// data only (no ball-by-ball events), since this is a scoreboard log, not a
// re-editable record. tournamentId/team1Id/team2Id start null; linking a
// match to a tournament later just fills them in on the same record (see
// confirmAddToTournament) rather than duplicating the match into a second
// store — the tournament dashboard is just a filtered, joined view of this
// same log.
function buildHistoryRecord(match){
  const { setup, innings1, innings2, winner, resultText } = match;
  return {
    teamA: setup.teamA, teamB: setup.teamB,
    scoreA: innings1.runs, wicketsA: innings1.wickets, oversA: oversDisplay(innings1.legalBalls),
    scoreB: innings2.runs, wicketsB: innings2.wickets, oversB: oversDisplay(innings2.legalBalls),
    winner, resultText,
    players: setup.players, overs: setup.overs,
    completedAt: new Date().toISOString(),
    tournamentId: null, team1Id: null, team2Id: null,
  };
}

// ---- Ball model ----
// Every ball is now: { delivery: 'NORMAL'|'WIDE'|'NO_BALL'|'DEAD_BALL', batRuns: number, wicket: boolean }
// This composes freely: a no-ball with 6 batting runs, a wide with a stumping, a run-out on the 3rd
// run of a no-ball (batRuns:2, delivery:NO_BALL, wicket:true -> 1 extra + 2 run + wicket), overthrows
// folded into batRuns, etc. Deliveries and outcomes are independent instead of fixed presets.
const DELIVERY_LABEL = { NORMAL:'Normal', WIDE:'Wide', NO_BALL:'No Ball', DEAD_BALL:'Dead Ball' };

function extraRuns(delivery){ return (delivery === 'WIDE' || delivery === 'NO_BALL') ? 1 : 0; }
function isLegalDelivery(delivery){ return delivery === 'NORMAL'; }
function ballTotalRuns(ball){ return ball.batRuns + extraRuns(ball.delivery); }

function ballChipLabel(ball){
  const parts = [];
  if(ball.delivery === 'WIDE') parts.push('WD');
  if(ball.delivery === 'NO_BALL') parts.push('NB');
  if(ball.delivery === 'DEAD_BALL') parts.push('DB');
  if(ball.batRuns > 0) parts.push(String(ball.batRuns));
  if(ball.wicket) parts.push('W');
  if(parts.length === 0) parts.push('0');
  return parts.join('+');
}
function ballChipClass(ball){
  if(ball.wicket) return 'chip chip-wicket';
  if(ball.delivery === 'WIDE' || ball.delivery === 'NO_BALL') return 'chip chip-extra';
  if(ball.delivery === 'DEAD_BALL') return 'chip chip-dead';
  if(ball.batRuns === 4 || ball.batRuns === 6) return 'chip chip-boundary';
  return 'chip';
}

// ---- Scoring engine ----
function isInningsOver(innings, players, overs){
  return innings.legalBalls >= maxLegalBalls(overs) || innings.wickets >= maxWickets(players);
}
function canRecordEvent(match){
  if(match.status === 'innings1') return !isInningsOver(match.innings1, match.setup.players, match.setup.overs);
  if(match.status === 'innings2') return !isInningsOver(match.innings2, match.setup.players, match.setup.overs);
  return false;
}
function computeResult(teamARuns, innings2, players){
  const teamBRuns = innings2.runs;
  if(teamBRuns > teamARuns){
    const wr = maxWickets(players) - innings2.wickets;
    return { winner:'B', text:'Team B won by ' + wr + ' wicket' + (wr===1?'':'s') + '.' };
  }
  if(teamBRuns < teamARuns){
    const margin = teamARuns - teamBRuns;
    return { winner:'A', text:'Team A won by ' + margin + ' run' + (margin===1?'':'s') + '.' };
  }
  return { winner:'TIE', text:'Match Tied' };
}

// Recomputes an innings' totals from its events list — the single source of
// truth is always the event list, so editing any past ball just means
// re-summing rather than reverse-engineering a delta.
function recomputeInnings(events){
  let runs = 0, wickets = 0, legalBalls = 0;
  for(const ball of events){
    runs += ballTotalRuns(ball);
    if(ball.wicket) wickets++;
    if(isLegalDelivery(ball.delivery)) legalBalls++;
  }
  return { runs, wickets, legalBalls, events };
}

// Re-checks innings/match completion after any change (new ball or an edit
// to a past one) — same rule as applyEvent, just callable standalone.
function reevaluateStatus(match){
  let next = { ...match };
  if(next.status === 'innings1'){
    if(isInningsOver(next.innings1, next.setup.players, next.setup.overs)){
      next.status = 'innings1-complete';
    }
  } else if(next.status === 'innings2'){
    const chaseTarget = next.innings1.runs + 1;
    const reachedTarget = next.innings2.runs >= chaseTarget;
    const inningsOver = isInningsOver(next.innings2, next.setup.players, next.setup.overs);
    if(reachedTarget || inningsOver){
      const result = computeResult(next.innings1.runs, next.innings2, next.setup.players);
      next.status = 'complete';
      next.winner = result.winner;
      next.resultText = result.text;
    }
  }
  return next;
}

function applyBall(match, ball){
  if(!canRecordEvent(match)) return match;
  const inningsKey = match.status === 'innings1' ? 'innings1' : 'innings2';
  const events = [...match[inningsKey].events, ball];
  const updatedInnings = recomputeInnings(events);
  let next = { ...match, [inningsKey]: updatedInnings };
  return reevaluateStatus(next);
}

// Edits a ball already in history, at `index`, within whichever innings is
// currently active (editing a finished innings' history is not offered in
// the UI, so this only ever touches the live innings).
function editBallAt(match, index, newBall){
  const inningsKey = match.status === 'innings1' ? 'innings1' : 'innings2';
  const events = match[inningsKey].events.slice();
  events[index] = newBall;
  const updatedInnings = recomputeInnings(events);
  let next = { ...match, [inningsKey]: updatedInnings };
  return reevaluateStatus(next);
}
function deleteBallAt(match, index){
  const inningsKey = match.status === 'innings1' ? 'innings1' : 'innings2';
  const events = match[inningsKey].events.slice();
  events.splice(index, 1);
  const updatedInnings = recomputeInnings(events);
  let next = { ...match, [inningsKey]: updatedInnings };
  return reevaluateStatus(next);
}

function startSecondInnings(match){
  if(match.status !== 'innings1-complete') return match;
  return { ...match, status:'innings2' };
}
function target(innings1Runs){ return innings1Runs + 1; }
function runsRequired(innings1Runs, innings2Runs){ return Math.max(0, target(innings1Runs) - innings2Runs); }

// ---- App state (persisted to IndexedDB while a match is live) ----
let state = {
  match: null,
  undoStack: [],
  menuOpen: false,
  confirmReset: false,
  confirmNewMatch: false,
  composer: null, // { mode:'new' } | { mode:'edit', index }
  composerDraft: null, // { delivery, batRuns, wicket }

  // Tournament tab
  activeTab: 'match',
  tournaments: [], // cached list, loaded at init and refreshed after create/delete
  selectedTournamentId: null,
  tournamentDialog: null, // 'create' | null
  confirmDeleteTournamentId: null,
  // Post-match "Add to Tournament?" prompt, shown once per finished match
  // when at least one tournament exists.
  addToTournamentPrompt: null, // { recordId, record } | null
  addToTournamentTeams: [], // teams belonging to the tournament currently selected in the prompt
  addToTournamentSelection: { tournamentId: null, team1Id: null, team2Id: null },
};

// ---- IndexedDB persistence ----
// Keeps the live match (score, wickets, ball history, undo stack) around
// across page refreshes/tab closes while it's in progress. As soon as the
// match reaches 'complete' (or the user resets/starts a new one), the saved
// record is deleted — nothing lingers once the match is over.
const IDB_NAME = 'cricketScoreboardDB';
const IDB_VERSION = 3;
const IDB_STORE = 'matchState';
const IDB_KEY = 'current';
// Permanent log of finished matches — the source data behind every
// tournament's standings and match log (see computeStandings/buildTournamentDashboard).
// Unlike matchState, entries here are never auto-cleared.
const IDB_HISTORY_STORE = 'matchHistory';
// Tournaments group teams and (via matchHistory.tournamentId) matches under
// one points table. Teams reference their tournament by id — the tournament
// itself does not duplicate a teamIds/matchIds list, so there is exactly one
// place that can go stale.
const IDB_TOURNAMENT_STORE = 'tournaments';
const IDB_TEAM_STORE = 'teams';

function idbOpen(){
  return new Promise((resolve, reject) => {
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unsupported')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(IDB_HISTORY_STORE)) db.createObjectStore(IDB_HISTORY_STORE, { keyPath:'id', autoIncrement:true });
      if(!db.objectStoreNames.contains(IDB_TOURNAMENT_STORE)) db.createObjectStore(IDB_TOURNAMENT_STORE, { keyPath:'id', autoIncrement:true });
      if(!db.objectStoreNames.contains(IDB_TEAM_STORE)) db.createObjectStore(IDB_TEAM_STORE, { keyPath:'id', autoIncrement:true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSaveMatch(match, undoStack){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({ match, undoStack }, IDB_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch(e){ console.warn('Could not save match to IndexedDB:', e); }
}
async function idbClearMatch(){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(IDB_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch(e){ console.warn('Could not clear match from IndexedDB:', e); }
}
async function idbLoadMatch(){
  try{
    const db = await idbOpen();
    const record = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return record;
  } catch(e){ console.warn('Could not load match from IndexedDB:', e); return null; }
}

// Returns the generated id so the caller can (optionally, later) link this
// same record to a tournament via idbUpdateHistoryRecord.
async function idbAddHistoryMatch(record){
  try{
    const db = await idbOpen();
    const id = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_HISTORY_STORE, 'readwrite');
      const req = tx.objectStore(IDB_HISTORY_STORE).add(record);
      let newId;
      req.onsuccess = () => { newId = req.result; };
      tx.oncomplete = () => resolve(newId);
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return id;
  } catch(e){ console.warn('Could not save match to history:', e); return null; }
}
async function idbUpdateHistoryRecord(record){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_HISTORY_STORE, 'readwrite');
      tx.objectStore(IDB_HISTORY_STORE).put(record);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch(e){ console.warn('Could not update history record:', e); }
}
async function idbGetAllHistory(){
  try{
    const db = await idbOpen();
    const list = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_HISTORY_STORE, 'readonly');
      const req = tx.objectStore(IDB_HISTORY_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return list;
  } catch(e){ console.warn('Could not load match history:', e); return []; }
}
// ---- Tournament / team persistence ----
async function idbAddTournament(record){
  try{
    const db = await idbOpen();
    const id = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_TOURNAMENT_STORE, 'readwrite');
      const req = tx.objectStore(IDB_TOURNAMENT_STORE).add(record);
      let newId;
      req.onsuccess = () => { newId = req.result; };
      tx.oncomplete = () => resolve(newId);
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return id;
  } catch(e){ console.warn('Could not create tournament:', e); return null; }
}
async function idbGetAllTournaments(){
  try{
    const db = await idbOpen();
    const list = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_TOURNAMENT_STORE, 'readonly');
      const req = tx.objectStore(IDB_TOURNAMENT_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return list;
  } catch(e){ console.warn('Could not load tournaments:', e); return []; }
}
async function idbAddTeam(record){
  try{
    const db = await idbOpen();
    const id = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_TEAM_STORE, 'readwrite');
      const req = tx.objectStore(IDB_TEAM_STORE).add(record);
      let newId;
      req.onsuccess = () => { newId = req.result; };
      tx.oncomplete = () => resolve(newId);
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return id;
  } catch(e){ console.warn('Could not create team:', e); return null; }
}
async function idbGetAllTeams(){
  try{
    const db = await idbOpen();
    const list = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_TEAM_STORE, 'readonly');
      const req = tx.objectStore(IDB_TEAM_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return list;
  } catch(e){ console.warn('Could not load teams:', e); return []; }
}
// Deleting a tournament removes it and its teams, and unlinks (rather than
// deletes) any matches that were linked to it — they fall back to being
// plain, unaffiliated entries in Match History instead of disappearing.
// One transaction across all three stores keeps that atomic.
async function idbDeleteTournamentCascade(tournamentId){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction([IDB_TOURNAMENT_STORE, IDB_TEAM_STORE, IDB_HISTORY_STORE], 'readwrite');
      tx.objectStore(IDB_TOURNAMENT_STORE).delete(tournamentId);

      const teamStore = tx.objectStore(IDB_TEAM_STORE);
      const teamReq = teamStore.getAll();
      teamReq.onsuccess = () => {
        teamReq.result.forEach(team => { if(team.tournamentId === tournamentId) teamStore.delete(team.id); });
      };

      const histStore = tx.objectStore(IDB_HISTORY_STORE);
      const histReq = histStore.getAll();
      histReq.onsuccess = () => {
        histReq.result.forEach(rec => {
          if(rec.tournamentId === tournamentId){
            histStore.put({ ...rec, tournamentId:null, team1Id:null, team2Id:null });
          }
        });
      };

      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch(e){ console.warn('Could not delete tournament:', e); }
}

// Every render's persistMatchState() call fires its IndexedDB write async
// and independently — without ordering, a save queued just before "Start
// New Match" (e.g. from opening the confirm popup, which still saves the
// live match) could finish AFTER the clear it was queued before, leaving
// stale data behind. Routing every operation through this single chained
// queue guarantees they run one at a time, in the order they were called.
let idbQueue = Promise.resolve();
function idbEnqueue(task){
  idbQueue = idbQueue.then(task, task);
  return idbQueue;
}
// Called at the end of every render — the single point where state.match
// reflects the latest change. Fire-and-forget: the UI never waits on it.
function persistMatchState(){
  if(!state.match || state.match.status === 'complete'){
    idbEnqueue(() => idbClearMatch());
  } else {
    const snapshotMatch = state.match, snapshotUndo = state.undoStack;
    idbEnqueue(() => idbSaveMatch(snapshotMatch, snapshotUndo));
  }
}

function commit(next, forUndo){
  if(forUndo) state.undoStack = [...state.undoStack, forUndo];
  state.match = next;
  render();
}
function handleStartMatch(setup){
  state.match = createMatch(setup);
  state.undoStack = [];
  render();
}
function handleQuickBall(ball){
  if(!state.match || !canRecordEvent(state.match)) return;
  const next = applyBall(state.match, ball);
  commit(next, state.match);
}
function handleStartSecondInnings(){
  if(!state.match) return;
  const next = startSecondInnings(state.match);
  commit(next, state.match);
}
function handleUndo(){
  if(state.undoStack.length === 0) return;
  const previous = state.undoStack[state.undoStack.length - 1];
  state.undoStack = state.undoStack.slice(0, -1);
  state.match = previous;
  render();
}
function resetToSetup(){
  state.match = null;
  state.undoStack = [];
  state.menuOpen = false;
  state.confirmReset = false;
  state.confirmNewMatch = false;
  state.composer = null;
  render();
}

function openComposerNew(){
  if(!state.match || !canRecordEvent(state.match)) return;
  state.composer = { mode:'new' };
  state.composerDraft = { delivery:'NORMAL', batRuns:0, wicket:false };
  render();
}
function openComposerEdit(index){
  const inningsKey = state.match.status === 'innings1' ? 'innings1' : 'innings2';
  const ball = state.match[inningsKey].events[index];
  state.composer = { mode:'edit', index };
  state.composerDraft = { delivery: ball.delivery, batRuns: ball.batRuns, wicket: ball.wicket };
  render();
}
function closeComposer(){
  state.composer = null;
  state.composerDraft = null;
  render();
}
function saveComposer(){
  const draft = state.composerDraft;
  const ball = draft.delivery === 'DEAD_BALL' ? { delivery:'DEAD_BALL', batRuns:0, wicket:false } : { ...draft };
  if(state.composer.mode === 'new'){
    const next = applyBall(state.match, ball);
    commit(next, state.match);
  } else {
    const next = editBallAt(state.match, state.composer.index, ball);
    state.match = next; // edits don't push undo — they directly correct the record
    render();
  }
  closeComposer();
}
function deleteComposerBall(){
  const next = deleteBallAt(state.match, state.composer.index);
  state.match = next;
  closeComposer();
}

// ---- Tournament tab ----
function setActiveTab(tab){
  state.activeTab = tab;
  document.getElementById('tabBtnMatch').classList.toggle('active', tab === 'match');
  document.getElementById('tabBtnTournament').classList.toggle('active', tab === 'tournament');
  document.getElementById('match-tab-content').classList.toggle('active', tab === 'match');
  document.getElementById('tournament-tab-content').classList.toggle('active', tab === 'tournament');
  if(tab === 'tournament') renderTournamentRoot();
}
function openTournament(id){
  state.selectedTournamentId = id;
  renderTournamentRoot();
}
function openCreateTournamentDialog(){
  state.tournamentDialog = 'create';
  renderTournamentRoot();
}
function closeCreateTournamentDialog(){
  state.tournamentDialog = null;
  renderTournamentRoot();
}
async function handleCreateTournament(name, teamNames){
  const tournamentId = await idbEnqueue(() => idbAddTournament({
    name, format:'round-robin', winPoints:2, tiePoints:1, createdAt: new Date().toISOString(),
  }));
  for(const teamName of teamNames){
    await idbEnqueue(() => idbAddTeam({ tournamentId, name: teamName, createdAt: new Date().toISOString() }));
  }
  state.tournaments = await idbGetAllTournaments();
  state.tournamentDialog = null;
  state.selectedTournamentId = tournamentId;
  renderTournamentRoot();
}
async function handleDeleteTournament(id){
  state.confirmDeleteTournamentId = null;
  await idbEnqueue(() => idbDeleteTournamentCascade(id));
  state.tournaments = state.tournaments.filter(t => t.id !== id);
  if(state.selectedTournamentId === id) state.selectedTournamentId = null;
  renderTournamentRoot();
}

// Standings are always recomputed fresh from matchHistory + teams — same
// "single source of truth, re-sum rather than track deltas" approach as
// recomputeInnings — so there's nothing to keep in sync when a linked
// match's score is edited or a team is removed.
function computeStandings(tournament, teams, matches){
  const table = {};
  teams.forEach(t => { table[t.id] = { id:t.id, name:t.name, played:0, wins:0, losses:0, ties:0, runsFor:0, runsAgainst:0, points:0 }; });
  matches.forEach(m => {
    const t1 = table[m.team1Id], t2 = table[m.team2Id];
    if(!t1 || !t2) return; // team since removed, or match not fully linked
    t1.played++; t2.played++;
    t1.runsFor += m.scoreA; t1.runsAgainst += m.scoreB;
    t2.runsFor += m.scoreB; t2.runsAgainst += m.scoreA;
    if(m.winner === 'TIE'){
      t1.ties++; t2.ties++;
      t1.points += tournament.tiePoints; t2.points += tournament.tiePoints;
    } else if(m.winner === 'A'){
      t1.wins++; t2.losses++; t1.points += tournament.winPoints;
    } else {
      t2.wins++; t1.losses++; t2.points += tournament.winPoints;
    }
  });
  return Object.values(table).sort((a, b) => {
    if(b.points !== a.points) return b.points - a.points;
    const rdA = a.runsFor - a.runsAgainst, rdB = b.runsFor - b.runsAgainst;
    if(rdB !== rdA) return rdB - rdA;
    return b.runsFor - a.runsFor;
  });
}

// ---- Post-match "Add to Tournament?" prompt ----
function openAddToTournamentDialog(recordId, record){
  state.addToTournamentPrompt = { recordId, record };
  state.addToTournamentTeams = [];
  loadTeamsForAddPrompt(state.tournaments[0].id);
}
async function loadTeamsForAddPrompt(tournamentId){
  const allTeams = await idbGetAllTeams();
  if(!state.addToTournamentPrompt) return; // dismissed while this was loading
  const teams = allTeams.filter(t => t.tournamentId === tournamentId);
  const norm = s => (s || '').trim().toLowerCase();
  const record = state.addToTournamentPrompt.record;
  const guess1 = teams.find(t => norm(t.name) === norm(record.teamA));
  const guess2 = teams.find(t => norm(t.name) === norm(record.teamB));
  state.addToTournamentTeams = teams;
  state.addToTournamentSelection = {
    tournamentId,
    team1Id: guess1 ? guess1.id : (teams[0] ? teams[0].id : null),
    team2Id: guess2 ? guess2.id : (teams[1] ? teams[1].id : (teams[0] ? teams[0].id : null)),
  };
  render();
}

function confirmAddToTournament(){
  const { recordId, record } = state.addToTournamentPrompt;

const root = document.getElementById('root');

function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    if(k === 'class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(k === 'disabled') { if(attrs[k]) e.setAttribute('disabled',''); }
    else e.setAttribute(k, attrs[k]);
  }
  for(const c of children.flat()){
    if(c === null || c === undefined) continue;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  }
  return e;
}

function groupByOverWithIndex(events){
  // Same as before but keeps the original event index on each ball so a
  // tap/hold on a chip can edit the right entry, even across over boundaries.
  const groups = []; let current = []; let legalCount = 0;
  events.forEach((ball, index) => {
    current.push({ ball, index });
    if(isLegalDelivery(ball.delivery)){
      legalCount++;
      if(legalCount % 6 === 0){ groups.push(current); current = []; }
    }
  });
  if(current.length > 0) groups.push(current);
  return groups;
}

function attachLongPress(chipEl, onTrigger){
  let timer = null;
  let fired = false;
  const start = () => {
    fired = false;
    timer = setTimeout(() => { fired = true; onTrigger(); }, 480);
  };
  const cancel = () => { if(timer) clearTimeout(timer); };
  chipEl.addEventListener('pointerdown', start);
  chipEl.addEventListener('pointerup', cancel);
  chipEl.addEventListener('pointerleave', cancel);
  chipEl.addEventListener('pointercancel', cancel);
  chipEl.addEventListener('dblclick', (e) => { e.preventDefault(); if(!fired) onTrigger(); });
}

async function buildTournamentDashboard(tournamentId){
  const tournament = state.tournaments.find(t => t.id === tournamentId);
  if(!tournament){ state.selectedTournamentId = null; return await buildTournamentHub(); }

  const [allTeams, allMatches] = await Promise.all([idbGetAllTeams(), idbGetAllHistory()]);
  const teams = allTeams.filter(t => t.tournamentId === tournamentId);
  const matches = allMatches.filter(m => m.tournamentId === tournamentId)
    .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
  const standings = computeStandings(tournament, teams, matches);

  const wrap = el('div', {class:'tournament-dashboard'},
    el('div', {class:'tournament-dash-header'},
      el('button', {type:'button', class:'btn-back', onclick: () => openTournament(null)}, '← Back'),

    el('p', {class:'tournament-dash-meta'},
      teams.length + ' team' + (teams.length === 1 ? '' : 's') + ' · ' + matches.length + ' match' + (matches.length === 1 ? '' : 'es') + ' played · '
      + tournament.winPoints + ' pts win, ' + tournament.tiePoints + ' pts tie'),
    el('h3', {class:'tournament-section-title'}, 'Standings'),
    renderStandingsTable(standings),
    el('h3', {class:'tournament-section-title'}, 'Match Log'),

  if(matches.length === 0){

  } else {
    wrap.appendChild(el('div', {class:'tournament-match-list'}, ...matches.map(renderTournamentMatchRow)));

  wrap.appendChild(el('button', {type:'button', class:'btn-delete-tournament', onclick: () => { state.confirmDeleteTournamentId = tournamentId; renderTournamentRoot(); }}, 'Delete Tournament'));

function renderComposer(){
  const draft = state.composerDraft;
  const isEdit = state.composer.mode === 'edit';
  const isDead = draft.delivery === 'DEAD_BALL';

  const deliveries = ['NORMAL','WIDE','NO_BALL','DEAD_BALL'];
  const segmented = el('div', {class:'segmented'}, ...deliveries.map(d =>
    el('button', {
      type:'button', class: draft.delivery === d ? 'active' : '',
      onclick: () => {
        draft.delivery = d;
        if(d === 'DEAD_BALL'){ draft.batRuns = 0; draft.wicket = false; }
        render();
      }
    }, DELIVERY_LABEL[d])
  ));

  const stepperValue = el('span', {class:'stepper-value'}, String(draft.batRuns));
  const stepperRow = el('div', {class:'stepper-row'},
    el('button', {type:'button', class:'stepper-btn', disabled:isDead || draft.batRuns<=0, onclick:()=>{ draft.batRuns = Math.max(0, draft.batRuns-1); render(); }}, '−'),
    stepperValue,
    el('button', {type:'button', class:'stepper-btn', disabled:isDead || draft.batRuns>=12, onclick:()=>{ draft.batRuns = Math.min(12, draft.batRuns+1); render(); }}, '+'),
  );
  const quickRuns = el('div', {class:'quick-runs'}, ...[0,1,2,3,4,6].map(n =>
    el('button', {type:'button', class: draft.batRuns===n ? 'active':'', disabled:isDead, onclick:()=>{ draft.batRuns = n; render(); }}, String(n))
  ));

  const toggle = el('div', {class:'toggle-switch' + (draft.wicket ? ' on' : '')});
  const wicketRow = el('div', {class:'wicket-toggle-row' + (draft.wicket ? ' on' : ''), onclick: () => {
      if(isDead) return;
      draft.wicket = !draft.wicket; render();
    }},
    el('span', {class:'wicket-toggle-label'}, 'Wicket on this ball'),
    toggle,
  );

  const total = isDead ? 0 : ballTotalRuns(draft);
  const legal = isLegalDelivery(draft.delivery);
  const preview = el('div', {class:'composer-preview'},
    'Adds ', el('b', {}, String(total) + ' run' + (total===1?'':'s')), ' to the total. ',
    'Legal ball: ', el('b', {}, legal ? 'Yes' : 'No'), '. ',
    'Wicket: ', el('b', {}, draft.wicket ? 'Yes' : 'No'), '.',
  );

  const card = el('div', {class:'composer-card'},
    el('h2', {class:'composer-title'}, isEdit ? 'Edit ball' : 'Custom ball'),
    el('p', {class:'composer-sub'}, isEdit
      ? 'Adjust the delivery, runs, or wicket for this ball — the scoreboard recalculates automatically.'
      : 'Compose deliveries the quick buttons can\'t — a no-ball hit for six, a run-out mid-run, a stumping off a wide.'),
    el('div', {class:'composer-section-label'}, 'Delivery'),
    segmented,
    el('div', {class:'composer-section-label'}, 'Runs actually run'),
    stepperRow,
    quickRuns,
    isDead ? el('p', {class:'composer-note'}, 'Dead ball voids the delivery — no runs, no wicket.') : null,
    wicketRow,
    preview,
    el('div', {class:'composer-actions'},
      el('button', {type:'button', class:'composer-cancel', onclick: closeComposer}, 'Cancel'),
      el('button', {type:'button', class:'composer-save', onclick: saveComposer}, isEdit ? 'Save changes' : 'Add ball'),
    ),
    isEdit ? el('button', {type:'button', class:'composer-delete', onclick: deleteComposerBall}, 'Remove this ball entirely') : null,
  );

  return el('div', {class:'composer-overlay', role:'dialog', 'aria-modal':'true'}, card);
}

function render(){
  root.innerHTML = '';
  const match = state.match;

  if(!match){
    root.appendChild(renderSetup());
  } else {
    const { setup, innings1, innings2, status } = match;

    // Log to the permanent Match History board exactly once, the moment a
    // match finishes — mutated in place (not replaced) so it survives the
    // spread-copies later updates would otherwise make from this object.
    // If any tournaments exist, follow up with the "Add to Tournament?"
    // prompt once the record's generated id comes back.
    if(status === 'complete' && !match.historyLogged){
      match.historyLogged = true;
      const record = buildHistoryRecord(match);
      idbEnqueue(() => idbAddHistoryMatch(record)).then(newId => {
        if(state.match !== match || newId == null) return; // moved on before this resolved
        if(state.tournaments.length > 0) openAddToTournamentDialog(newId, record);
      });
    }

    if(status !== 'complete') root.appendChild(renderHeader());

    if(status === 'innings1'){
      const disabled = !canRecordEvent(match);
      root.appendChild(renderScoreboard(setup.teamA, innings1, setup, false));
      root.appendChild(renderRunButtons(disabled));
      root.appendChild(renderEventButtons(disabled));
      root.appendChild(renderSecondaryRow(disabled));
      root.appendChild(renderHistory(innings1.events));
    } else if(status === 'innings1-complete'){
      root.appendChild(renderInningsSummary(setup, innings1));
    } else if(status === 'innings2'){
      const disabled = !canRecordEvent(match);
      root.appendChild(renderScoreboard(setup.teamB, innings2, setup, true, innings1.runs));
      root.appendChild(renderRunButtons(disabled));
      root.appendChild(renderEventButtons(disabled));
      root.appendChild(renderSecondaryRow(disabled));
      root.appendChild(renderHistory(innings2.events));
    } else if(status === 'complete'){
      root.appendChild(renderResult(match));
    }
  }

  if(state.confirmReset || state.confirmNewMatch){
    root.appendChild(renderConfirm());
  }
  if(state.composer){
    root.appendChild(renderComposer());
  }
  if(state.addToTournamentPrompt){
    root.appendChild(renderAddToTournamentDialog());
  }

  persistMatchState();
}

// ---- Init ----
// On load, try to resume an in-progress match saved in IndexedDB. A match
// that had already finished is never restored (it would already have been
// cleared, but this is a safety net for older/partial records too).
(async function init(){
  const [saved, tournaments] = await Promise.all([idbLoadMatch(), idbGetAllTournaments()]);
  state.tournaments = tournaments;
  if(saved && saved.match && saved.match.status !== 'complete'){
    state.match = saved.match;
    state.undoStack = Array.isArray(saved.undoStack) ? saved.undoStack : [];
  }
  document.getElementById('tabBtnMatch').addEventListener('click', () => setActiveTab('match'));
  document.getElementById('tabBtnTournament').addEventListener('click', () => setActiveTab('tournament'));
  render();
})();
</script>
